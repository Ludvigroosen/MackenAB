<!DOCTYPE html>
<html lang="sv" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoppsan — Macken &amp; Macken AB</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141312'/%3E%3Cpath d='M11 8h7a3 3 0 0 1 3 3v9a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2V8z' fill='%23c8482e'/%3E%3Cpath d='M21 11h2.5c1 0 1.5.7 1.5 1.6V16' stroke='%23c8482e' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='25' cy='19' r='1.6' fill='%23c8482e'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("mm-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (!stored && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              paper: "#faf9f5",
              "paper-soft": "#f2efe6",
              ink: "#1a1613",
              "ink-soft": "#5b544c",
              night: "#141312",
              "night-soft": "#1e1b18",
              cloud: "#ede9e2",
              "cloud-soft": "#a49c90",
              rust: "#c8482e",
            },
            fontFamily: {
              display: ['"Space Grotesk"', '"Inter"', "sans-serif"],
              sans: ['"Inter"', "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body
    class="grain grid min-h-screen place-items-center bg-paper px-6 text-ink dark:bg-night dark:text-cloud"
  >
    <main class="w-full max-w-md text-center">
      <p class="kicker text-rust">Fel 200 · Ingenting hände</p>
      <h1 class="mt-5 font-display text-[clamp(2.5rem,10vw,4.5rem)] font-bold leading-none">
        Hoppsan.
      </h1>
      <p class="mt-6 text-lg leading-relaxed text-ink-soft dark:text-cloud-soft">
        Det där formuläret fungerade ju inte. Vi sa ju det.
      </p>
      <p class="mt-2 text-ink-soft dark:text-cloud-soft">
        Inget skickades. Inget händer. Precis som vi gillar det.
      </p>
      <a
        href="index.html"
        class="mt-9 inline-flex items-center gap-2 rounded-full bg-ink px-6 py-3 text-sm font-medium text-paper transition-transform hover:-translate-y-0.5 dark:bg-cloud dark:text-night"
      >
        <svg class="h-4 w-4" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Tillbaka till verkligheten
      </a>
    </main>
  </body>
</html>
